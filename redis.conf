# Security Watchtower — Redis Configuration
# Hardened for production/internal use

# Listen on container interfaces; Compose intentionally publishes no host port.
bind 0.0.0.0
protected-mode yes

# Port
port 6379

# Persistence (RDB snapshots)
save 900 1
save 300 10
save 60 10000
dir /data
dbfilename watchtower.rdb

# Memory limits
maxmemory 256mb
# Security findings must not be silently evicted. Writes fail visibly at the
# limit so supervision can stop and alert instead of losing evidence.
maxmemory-policy noeviction

# Durable production evidence with at most one second of acknowledged-write loss.
appendonly yes
appendfsync everysec

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
rename-command SLAVEOF  ""
rename-command REPLICAOF ""
rename-command SHUTDOWN "WATCHTOWER_SHUTDOWN_ONLY"

# Logging
loglevel notice
logfile ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Timeout
timeout 300
tcp-keepalive 60

# Max clients
maxclients 100
